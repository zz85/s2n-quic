[section]
anchor = "stream"
title = "Stream packets"
problem = "A stream carries ordered application bytes over a network that drops and reorders packets; without a fixed layout, a receiver couldn't find the stream a packet belongs to or its place in the stream, or tell a retransmission from new data."
motivation = "A layout in which the tag's flags say which optional fields follow keeps short packets short, and a retransmission that keeps its original packet number lets the receiver open it with the key and nonce of the first transmission."
prose = "A stream packet carries part of a stream: its tag's flags, its credentials and wire version, two reserved bytes, the stream identifier, an optional source queue identifier, the packet number, a retransmission offset on a reliable stream, the next control packet number the sender expects, the stream offset, an optional final offset, the lengths of its parts, an optional application header, optional control data, the payload, and the authentication tag. The payload is encrypted, and every byte before it is authenticated. A reliable stream retransmits a packet with the packet number and nonce of the original, and records the retransmission's own number as an offset from it."

[[requirement]]
id = "DC-0004-012"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "In a stream packet's tag, bit 0x20 MUST be set exactly when the packet carries a source queue identifier."
rationale = "A receiver learns from the tag alone whether a source queue identifier follows."

[[requirement]]
id = "DC-0004-013"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "In a stream packet's tag, bit 0x10 MUST be set exactly when the packet belongs to the recovery packet space."
rationale = "A receiver tells recovery packets from other stream packets by this bit."

[[requirement]]
id = "DC-0004-014"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "In a stream packet's tag, bit 0x08 MUST be set exactly when the packet carries control data."
rationale = "A receiver learns from the tag alone whether the control data length and the control data follow."

[[requirement]]
id = "DC-0004-015"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "In a stream packet's tag, bit 0x04 MUST be set exactly when the packet carries a final offset."
rationale = "A receiver learns from the tag alone whether a final offset follows."

[[requirement]]
id = "DC-0004-016"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "In a stream packet's tag, bit 0x02 MUST be set exactly when the packet carries an application header."
rationale = "A receiver learns from the tag alone whether the application header length and the application header follow."

[[requirement]]
id = "DC-0004-017"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Bit 0x01 of a stream packet's tag MUST hold the key phase of the key that sealed the packet."
rationale = "The receiver chooses between the current and the next key from this bit."

[[requirement]]
id = "DC-0004-018"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A stream packet's fields MUST appear in this order: the tag, the credentials, the wire version, two reserved bytes, the stream identifier, the source queue identifier, the packet number, the retransmission offset, the next expected control packet number, the stream offset, the final offset, the control data length, the payload length, the application header length, the application header, the control data, the payload and the authentication tag, each optional field only where its condition holds."
rationale = "A fixed order lets a receiver read each field without a marker for it."

[[requirement]]
id = "DC-0004-019"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST set the two reserved bytes that follow a stream packet's wire version to zero."
rationale = "The bytes once held a port that a later field replaced, and zero keeps them free for a later version."

[[requirement]]
id = "DC-0004-020"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A stream identifier MUST be one variable-length integer whose value is the stream's queue identifier multiplied by 4, plus 2 where the stream is reliable, plus 1 where it is bidirectional."
rationale = "One integer names the receiving queue and the stream's two properties."

[[requirement]]
id = "DC-0004-021"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The source queue identifier, packet number, next expected control packet number, stream offset, final offset and every length of a stream packet MUST be variable-length integers."
rationale = "The integers take only the bytes their values need."

[[requirement]]
id = "DC-0004-022"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A packet of a reliable stream MUST carry a 4-byte retransmission offset after its packet number, whose value added to the packet number gives the number of this transmission."
rationale = "The packet number stays the original's, so the seal's nonce doesn't change, and the offset tells the receiver which transmission arrived."

[[requirement]]
id = "DC-0004-023"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A receiver MUST NOT accept a stream packet whose packet number plus retransmission offset is larger than the largest value a variable-length integer holds."
rationale = "A transmission number past that value can't be encoded, so such a packet is malformed."

[[requirement]]
id = "DC-0004-024"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The nonce of a stream packet's seal MUST be its packet number."
rationale = "A retransmission keeps the original's packet number, so it is opened with the nonce of the first transmission."

[[requirement]]
id = "DC-0004-025"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The associated data of a stream packet's seal MUST be every byte from its tag to the end of its control data."
rationale = "Every header field, the application header and the control data are authenticated, while only the payload is encrypted."

[[requirement]]
id = "DC-0004-026"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A stream packet in the recovery packet space that isn't a retransmission MUST NOT carry a payload."
rationale = "A recovery packet probes the path, and its authentication tag covers the header alone; a retransmission in the recovery space keeps the payload of the packet it repeats."

[[requirement]]
id = "DC-0004-027"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A sender MUST NOT retransmit a packet of a stream that isn't reliable."
rationale = "Only a reliable stream's packets carry the retransmission offset."

[[requirement]]
id = "DC-0004-028"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Before a receiver opens a retransmitted stream packet, it MUST clear the tag's recovery bit, set the four retransmission offset bytes to zero and remove the retransmission's change to the authentication tag, so that it checks the header the first transmission sealed."
rationale = "A retransmission isn't sealed again: its sender adjusts the original's authentication tag for the new transmission number, and the receiver undoes that adjustment."

[[requirement]]
id = "DC-0004-029"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A receiver MUST take a stream packet as its stream's last where the packet's final offset equals its stream offset plus its payload length."
rationale = "The final offset marks the stream's end, and a packet whose payload reaches it ends the stream."
