[section]
anchor = "secret-transfer"
title = "Secret transfer message"
problem = "Where the process that establishes a path secret isn't the process that uses it, the secret and the path's parameters have to move between them, and a receiver that misread the message would use the wrong keys or limits."
motivation = "A versioned message with a fixed layout carries the ciphersuite, the exported secret and the application parameters together, so the receiving process builds the same path state."
prose = "A secret transfer message moves a path secret between two processes on the same host. It holds a version byte, the ciphersuite, the exported secret, the application parameters with their own version byte, the time the sender encoded the message, and an opaque payload."

[[requirement]]
id = "DC-0004-071"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A secret transfer message MUST hold, in this order, a version byte, a ciphersuite byte, the export secret's length as a variable-length integer and its bytes, an application parameters version byte, the application parameters, an 8-byte encode time, and the payload's length as a variable-length integer and its bytes."
rationale = "A fixed order lets the receiving process read each field without a marker for it."

[[requirement]]
id = "DC-0004-072"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A secret transfer message MUST be sent only over a channel between processes on one host."
rationale = "The message holds the export secret unencrypted, so it never travels over a network path."

[[requirement]]
id = "DC-0004-073"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A receiver MUST NOT accept a secret transfer message whose version byte or application parameters version byte is other than 0."
rationale = "A receiver can't know the layout of a version it doesn't implement."

[[requirement]]
id = "DC-0004-074"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A secret transfer message's ciphersuite byte MUST be 0 for AES-128-GCM with SHA-256 and 1 for AES-256-GCM with SHA-384."
rationale = "Both processes derive the same keys only where they agree on the ciphersuite."

[[requirement]]
id = "DC-0004-075"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A receiver MUST NOT accept a secret transfer message whose ciphersuite byte is other than 0 or 1."
rationale = "A receiver can't derive keys for a ciphersuite it doesn't know."

[[requirement]]
id = "DC-0004-076"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The application parameters MUST hold, in this order, the maximum datagram size as a 2-byte integer, then the remote maximum data, the local send maximum data, the local receive maximum data, the maximum idle timeout in milliseconds with 0 for none, and the maximum number of queues, each a variable-length integer."
rationale = "The receiving process applies the same limits as the process that established the path."

[[requirement]]
id = "DC-0004-077"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A receiver MUST NOT accept application parameters whose maximum idle timeout is larger than 4294967295 milliseconds."
rationale = "The timeout is kept as a 4-byte count of milliseconds."

[[requirement]]
id = "DC-0004-078"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The encode time of a secret transfer message MUST be its sender's raw monotonic clock in microseconds when it encoded the message."
rationale = "The receiving process can tell how long the message waited before it was read."
