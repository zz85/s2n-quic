[section]
anchor = "admission"
title = "Admission by credit"
problem = "Storage operations run on a bounded set of execution slots. When submitters take slots before they know that the device can accept their work, blocked slots can wait on work that never gets a slot, and the system deadlocks."
motivation = "Gating each operation on credit from the device's budget before it takes any execution slot bounds admitted work by the budget, and a submitter that waits for credit holds no slot, so the hold-and-wait cycle cannot form. Priority tiers let latency-sensitive reads go ahead of background writes."
prose = "Each device holds one or two credit pools. A pool's capacity starts at the capacity the device's configuration sets for it, the device's queue depth, and changes at run time from the device's answers. A would-block answer, such as EAGAIN, says that the device can't take an operation now; it halves the capacity of the pool the operation drew from, and the would-block answers to operations that pool granted before that decrease don't lower it again. A clean completion is the completion of an operation that the device took without a would-block answer and that returns its credit while a submitter waits for credit from the same pool. A pool's first run of clean completions begins when its device is created, and a new run begins at each would-block answer to an operation that drew from the pool, at each raise of the pool's capacity and at the end of the run before it. A run ends at the clean completion that brings the summed cost of the run's clean completions to at least the capacity the pool had when the run began, and that completion raises the capacity by its operation's cost. A decrease never takes the capacity below the cost of an operation that waits for the pool's credit, an operation whose cost is higher than the capacity raises the capacity to its cost as it begins to wait, and only an upper bound that the configuration sets stops the capacity from rising. Each change of the capacity changes the pool's free credit by the same amount, so a lower capacity takes its difference back from the credit that completing operations return, and never from an operation that holds credit. Where this RFC says a pool's capacity, it means its current capacity, and the configured capacity is the value it starts at. An operation's cost, in credits, is taken from a pool before the operation enters the device's execution pipeline and is returned when the operation completes. A submitter that finds the pool short of credit waits without holding a thread or an execution slot. Each operation carries a priority tier. A device's configuration also holds a rate ceiling, in operations or in bytes per second, which this version stores and doesn't yet apply to admission."

[[requirement]]
id = "DC-0011-005"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The device MUST acquire an operation's whole cost in credit from its pool before the operation enters the execution pipeline."
rationale = "Admitting work before its credit is held would let admitted work exceed the pool's capacity."

[[requirement]]
id = "DC-0011-006"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A submitter waiting for credit MUST NOT hold a thread or an execution slot while it waits."
rationale = "A waiter that held a slot would recreate the deadlock that admission exists to prevent."

[[requirement]]
id = "DC-0011-007"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The device MUST grant an operation its whole cost in one grant, and never a part of it."
rationale = "An operation cannot run on part of its cost, so two operations that each held a part would wait on each other forever."

[[requirement]]
id = "DC-0011-008"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "The device MUST NOT create execution lanes or threads in response to load after it registers."
rationale = "Execution capacity that grows under load has no bound, which is the failure the scheduler replaces."

[[requirement]]
id = "DC-0011-009"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The device MUST grant credit to the waiting submitters of one priority tier in the order in which they began to wait."
rationale = "Order of arrival within a tier keeps one submitter from starving another of the same tier."

[[requirement]]
id = "DC-0011-010"
level = "SHOULD"
polarity = "required"
binds_to = "system"
statement = "The device SHOULD grant credit to a waiting submitter of a higher priority tier before a waiting submitter of a lower tier."
rationale = "Latency-sensitive reads need to go ahead of background writes when both wait on one device."

[[requirement]]
id = "DC-0011-011"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The device MUST return an operation's credit to the pool it came from exactly once, whether the operation succeeds, fails or is cancelled."
rationale = "Credit returned twice would let admitted work exceed the capacity, and credit never returned would shrink the device until it stalls."

[[requirement]]
id = "DC-0011-012"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The device MUST keep its configured rate ceiling, in operations or in bytes per second, with its configuration."
rationale = "The rate ceiling is part of a device's configuration, so a later version can pace admission by it without a change to how devices are configured."

[[requirement]]
id = "DC-0011-045"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The device MUST start each pool's capacity at the capacity the device's configuration sets for that pool."
rationale = "The configured queue depth is the operator's first estimate of how much work the device takes at once, and the pool discovers the device's real depth from there."

[[requirement]]
id = "DC-0011-046"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "On a would-block answer to an operation, the device MUST lower the capacity of the pool the operation drew from to half its value, rounded up, or to the largest cost among the operations waiting for that pool's credit where that cost is higher."
rationale = "A would-block answer shows that the device holds more work than it can take, so halving the capacity backs off at once, while every waiting operation can still be granted its whole cost."

[[requirement]]
id = "DC-0011-047"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "The device MUST NOT lower a pool's capacity for a would-block answer to an operation that the pool granted before its last decrease."
rationale = "Operations granted before a decrease were admitted under the old capacity, so their would-block answers report the overload that decrease already answered, and counting each one would collapse the capacity."

[[requirement]]
id = "DC-0011-048"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "When an operation whose cost is higher than its pool's capacity begins to wait for the pool's credit, the device MUST raise the pool's capacity to that operation's cost."
rationale = "An operation is granted its whole cost or nothing, so an operation that waits on a pool whose capacity is below its cost would never be granted; DC-0011-022 keeps the cost within any upper bound the device's configuration sets for the pool, so the raise never passes the upper bound."

[[requirement]]
id = "DC-0011-049"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "When a clean completion from a pool brings the summed cost of the clean completions in the pool's current run to at least the capacity the pool had when that run began, the device MUST raise the pool's capacity by the cost of that completion's operation, up to the upper bound the device's configuration sets for the pool where it sets one."
rationale = "A small, steady raise while submitters wait finds the device's real depth from its own answers, without a limit that the device chooses for itself, and only an operator's configured bound stops it."

[[requirement]]
id = "DC-0011-050"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The registry MUST refuse, with an invalid-input error, to create a device whose configuration sets an upper bound for a pool's capacity below that pool's configured capacity."
rationale = "A pool starts at its configured capacity, so an upper bound below it contradicts the configuration that sets both."

[[requirement]]
id = "DC-0011-051"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The device MUST change a pool's free credit by the same amount as each change of the pool's capacity."
rationale = "A matching change keeps the pool's credit adding up to its capacity, as DC-0008-026 requires, so a lower capacity takes its difference back from the credit that completing operations return."

[[requirement]]
id = "DC-0011-052"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A decrease of a pool's capacity MUST NOT take credit from an operation that holds it."
rationale = "An operation that holds its credit may already be running on the device, so taking its credit would leave work running that the pool no longer counts."
