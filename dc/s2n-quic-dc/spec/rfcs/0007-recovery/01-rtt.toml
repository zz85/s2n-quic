[section]
anchor = "rtt"
title = "Round-trip time estimation"
problem = "Loss detection, the probe timer and the congestion controller each need to know how long the network takes to answer, and a stale or inflated estimate makes recovery slow."
motivation = "One estimate for each sender, updated from every acknowledgement and started at a value that fits a data-center network, keeps recovery measured in the network's own round trips."
prose = "Each sender keeps its own estimate of the round-trip time to its peer: the latest sample, a smoothed value, the variation of the samples and the minimum sample, maintained as QUIC maintains them. A sample comes from each acknowledgement that newly acknowledges a packet carrying data: the time from the send of the newest such packet to the acknowledgement's arrival, less the acknowledgement delay the peer reports, and never less than one microsecond. A sender that mostly reads sends few data packets, and keeps its estimate fresh from the acknowledgement-only probes that RFC 0005 describes. Until a sample arrives, the estimate starts at 2 milliseconds, a value suited to a data-center network, so that the first probe after an early loss follows within a few milliseconds. The estimate is updated before loss detection runs, since the loss time threshold depends on it."

[[requirement]]
id = "DC-0007-001"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The system MUST keep a round-trip time estimate for each sender, holding its latest sample, a smoothed value, the variation of the samples and the minimum sample."
rationale = "Loss detection, the probe timer and the controller each read a different part of the estimate."

[[requirement]]
id = "DC-0007-002"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "On an acknowledgement that newly acknowledges a data packet, the system MUST take a round-trip time sample from the newest packet it newly acknowledges: the time from that packet's send to the acknowledgement's arrival, less the acknowledgement delay the peer reports."
rationale = "The newest newly acknowledged packet yields the freshest sample, and the delay the peer reports isn't part of the network's round trip."

[[requirement]]
id = "DC-0007-003"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A round-trip time sample MUST NOT be less than one microsecond."
rationale = "A sample of zero or below would make the smoothed value and the timers meaningless."

[[requirement]]
id = "DC-0007-004"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "On an acknowledgement that doesn't newly acknowledge a data packet but covers an acknowledgement-only probe, the system MUST take the round-trip time sample from that probe."
rationale = "A sender that mostly reads sends few data packets, and its estimate would otherwise go stale."

[[requirement]]
id = "DC-0007-005"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Before its first sample, the system MUST use an initial round-trip time of 2 milliseconds."
rationale = "A data-center round trip is well under a millisecond to a few milliseconds, so a small start lets the first probe after an early loss follow within a few milliseconds."

[[requirement]]
id = "DC-0007-006"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The system MUST update the round-trip time estimate from an acknowledgement before it runs loss detection for that acknowledgement."
rationale = "The loss time threshold depends on the estimate, so a fresh sample keeps a slow round trip from being read as loss."
