[section]
anchor = "congestion-control"
title = "Congestion control"
problem = "A sender that sends faster than the path carries builds queues and drops in the network, and one that sends slower than the path wastes it."
motivation = "A controller for each sender that models the path's bandwidth and round trip keeps the queues short on a data-center network while keeping the path full."
prose = "Each sender has one congestion controller, created with the path's maximum datagram size. The controller is model-based: it estimates the path's bottleneck bandwidth and its minimum round-trip time from the acknowledgements it receives, and sets the congestion window, the pacing rate and the send quantum from those estimates, with loss and congestion marks as further signals. A sender that has no more application data queued doesn't lower its rate or its window for the room it leaves unused, so a quiet sender isn't read as a slow path. A run of consecutive lost packet numbers counts as one loss event, and each increase of the peer's count of packets marked congestion experienced counts as a sign of congestion. A sender that probes above its bandwidth estimate ends the probe once more than half of the data an acknowledgement shows delivered was marked, and caps its window near the total size of its outstanding packets when it sent that data. The sender takes an acknowledgement's congestion marks and losses into account before it raises its rate or its window for the data that acknowledgement acknowledges. The sender doesn't treat a long silence as persistent congestion: the probe timer and the model cover it. The sender sends new data frames only while it has room for new data, as a fast retransmission, or when the frames make up a probe, and each send carries at most the send quantum. The room for new data is the window less the total size of the outstanding packets, leaving out each packet whose frames a probe has carried again, and it is never less than zero."

[[requirement]]
id = "DC-0007-023"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The system MUST give each sender one window and one sending rate, set from the acknowledgements, losses and congestion marks of all of that sender's packets."
rationale = "A sender's packets share one path and one sequence of packet numbers, so one controller sees all of their signals."

[[requirement]]
id = "DC-0007-024"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Except when it sends a fast retransmission or a probe, a sender MUST send a packet that becomes outstanding only where the total size of its outstanding packets whose frames no probe has carried again, that packet included, stays within a window that it sets from the path's bottleneck bandwidth and minimum round-trip time, as it measures them from the acknowledgements it receives."
rationale = "A model of bandwidth and round trip keeps queues short on a network whose losses are rare and whose round trips are short."

[[requirement]]
id = "DC-0007-040"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The rate at which a sender sends data MUST follow the path's bottleneck bandwidth, as the sender measures it from the acknowledgements it receives."
rationale = "Sending at the bottleneck's rate keeps the path full without building a queue in front of it."

[[requirement]]
id = "DC-0007-025"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A sender MUST NOT lower its sending rate or its window because it sent less than its window allows while it had no application data queued."
rationale = "A sender that had nothing to send says nothing about the path, and reading it as a slow path would hold back the data that follows."

[[requirement]]
id = "DC-0007-026"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST respond to a run of consecutive lost packet numbers as it responds to one lost packet."
rationale = "One overflow of a queue drops a run of packets, and counting each packet as its own event would overstate the congestion."

[[requirement]]
id = "DC-0007-027"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST lower a limit that caps its window, and that never caps it below the sender's minimum window, within the round trip after one in which the peer's count of packets marked congestion experienced increased after both that round trip's start and the sender's last start of a cycle of bandwidth probing, unless the sender was starting up or probing for more bandwidth when that round trip ended."
rationale = "Congestion marks show a queue building before it drops packets. The cap falls rather than the window itself, since in some states the window already sits below the cap, and at the minimum window the sender keeps enough data outstanding to go on measuring the path. A sender starting up or probing for more bandwidth builds a short queue on purpose, so a round trip that ends in either phase leaves the cap as it is. Each cycle of bandwidth probing opens with a phase in which the sender sends below the path's bandwidth, and it starts with fresh congestion signals, so marks from before its start don't count. A sender that drains the queue its start-up built, or that probes its round-trip time, doesn't send faster than the path, so marks in a round trip spent wholly in either phase still lower the cap."

[[requirement]]
id = "DC-0007-043"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender that is starting up MUST end its start-up, in which it raises its sending rate each round trip, after two consecutive round trips in each of which the packets marked congestion experienced, each counted at the path's maximum datagram size, made up more than half of the data delivered."
rationale = "A sender starting up raises its rate fast, so two round trips in a row with most of the delivered data marked show that it has filled the path, while one such round trip can be a passing burst."

[[requirement]]
id = "DC-0007-044"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender that is sending above its estimate of the path's bottleneck bandwidth to probe for more bandwidth MUST end that probe and lower its sending rate below its estimate on an acknowledgement for which the packets marked congestion experienced, each counted at the path's maximum datagram size, made up more than half of the data delivered between the send of the newest packet that acknowledgement acknowledges and its arrival."
rationale = "Most of the delivered data marked while the sender sends above its estimate shows that the extra rate built a queue, so the sender stops adding to the queue and drains it at once, rather than at the probe's planned end."

[[requirement]]
id = "DC-0007-045"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "On an acknowledgement that ends a probe as DC-0007-044 describes, the sender MUST set a limit that caps its window, and that never caps it below the sender's minimum window, to the larger of the total size of its outstanding packets whose frames no probe had carried again when it sent the newest packet that acknowledgement acknowledges and seven tenths of the smaller of its window and its estimate of the path's bandwidth-delay product, unless it sent that packet within an application-limited period: one that opens when the sender runs out of queued application data while no such period is open, and that closes on the first acknowledgement after which the data the sender has seen acknowledged, declared lost or discarded since the period opened exceeds the total size of its outstanding packets whose frames no probe had carried again when the period opened."
rationale = "The total size of the sender's outstanding packets when it sent the marked data, the quantity DC-0007-031 counts against the window, is the amount the path carried before the queue built, and seven tenths of the window keeps the cap from falling to it when that amount was small. A packet sent within an application-limited period, until the data outstanding when the sender ran out of queued data has left the path, yields a sample shaped by the sender's own pauses and not by the path, so it leaves the cap as it was. Never capping below the minimum window keeps enough data outstanding to go on measuring the path."

[[requirement]]
id = "DC-0007-028"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST apply an acknowledgement's losses and congestion marks to its sending rate and its window before it raises either of them for the data that acknowledgement acknowledges."
rationale = "The sender adapts to loss at the end of a round, so a round's losses and marks have to count before its closing acknowledgement raises the rate."

[[requirement]]
id = "DC-0007-029"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A sender MUST NOT send new data frames while it has no room for new data, unless it sends them as a fast retransmission or as a probe."
rationale = "Sending past the window builds queues, and fast retransmission lets recovery go on while the window is full."

[[requirement]]
id = "DC-0007-030"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Each send of a sender MUST put at most its send quantum on the wire, counted in datagrams of the path's maximum size and rounded up."
rationale = "The send quantum bounds the burst that one send puts on the wire."

[[requirement]]
id = "DC-0007-031"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The room a sender has for new data MUST be the larger of zero and its window less the total size of its outstanding packets whose frames no probe has carried again."
rationale = "The window bounds the data in flight only where the room it leaves counts each outstanding packet, and a probe already counts the frames it carries again."

[[requirement]]
id = "DC-0007-032"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A packet whose frames a probe carries again MUST NOT take room in the window once the probe is sent."
rationale = "A probe's packet and the original carry the same frames, and counting both would shrink the window that new data can use."
