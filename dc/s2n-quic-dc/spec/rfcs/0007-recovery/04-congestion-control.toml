[section]
anchor = "congestion-control"
title = "Congestion control"
problem = "A sender that sends faster than the path carries builds queues and drops in the network, and one that sends slower than the path wastes it."
motivation = "A controller for each sender that models the path's bandwidth and round trip keeps the queues short on a data-center network while keeping the path full."
prose = "Each sender has one congestion controller, created with the path's maximum datagram size. The controller is model-based: it estimates the path's bottleneck bandwidth and its minimum round-trip time from the acknowledgements it receives, and sets the congestion window, the pacing rate and the send quantum from those estimates, with loss and congestion marks as further signals. The sender tells it the size of each packet it sends and whether more application data waits behind it, so that a sender with nothing to send isn't read as a slow path. For each acknowledgement, the sender updates the round-trip time estimate, reports each increase of the peer's count of packets marked congestion experienced, runs loss detection and reports each lost packet with whether it begins a new run of lost packet numbers, and only then reports the bytes the acknowledgement newly acknowledges. The sender doesn't report persistent congestion: the probe timer and the model cover a long silence. The sender sends new data frames only while the window has room, while the controller asks for fast retransmission, or when the frames make up a probe, and each send carries at most the send quantum. Outstanding bytes count each outstanding packet once: when a probe carries a packet's frames, the original's bytes leave the count."

[[requirement]]
id = "DC-0007-023"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The system MUST keep one congestion controller for each sender."
rationale = "A sender's packets share one path and one sequence of packet numbers, so one controller sees all of their signals."

[[requirement]]
id = "DC-0007-024"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The congestion controller MUST estimate the path's bottleneck bandwidth and its minimum round-trip time from acknowledgements, and set the congestion window and the pacing rate from those estimates."
rationale = "A model of bandwidth and round trip keeps queues short on a network whose losses are rare and whose round trips are short."

[[requirement]]
id = "DC-0007-025"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The system MUST tell the controller the size of each packet it sends, and whether the sender has more application data queued."
rationale = "Without knowing that a sender had nothing to send, the controller would read a quiet sender as a slow path."

[[requirement]]
id = "DC-0007-026"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The system MUST report each lost packet's bytes to the controller, with whether it begins a new run of lost packet numbers."
rationale = "The controller reacts to the number of separate loss events, not only to the bytes lost."

[[requirement]]
id = "DC-0007-027"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The system MUST report to the controller each increase of the peer's count of packets marked congestion experienced."
rationale = "Congestion marks show a queue building before it drops packets."

[[requirement]]
id = "DC-0007-028"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The system MUST give the controller an acknowledgement's newly acknowledged bytes only after it has run loss detection and read the congestion marks of that acknowledgement."
rationale = "The controller adapts to loss at the end of a round, so a round's losses have to be recorded before its closing acknowledgement."

[[requirement]]
id = "DC-0007-029"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A sender MUST NOT send new data frames while its controller reports it limited by the congestion window, unless the controller asks for fast retransmission or the frames make up a probe."
rationale = "Sending past the window builds queues, and fast retransmission lets recovery go on while the window is full."

[[requirement]]
id = "DC-0007-030"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The system MUST bound each send of a sender to its controller's send quantum, in datagrams of the path's maximum size, rounded up."
rationale = "The send quantum bounds the burst that one send puts on the wire."

[[requirement]]
id = "DC-0007-031"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The outstanding bytes that the controller holds MUST equal the total size of the outstanding packets whose bytes still count."
rationale = "The window and the pacing decisions are only as accurate as this count."

[[requirement]]
id = "DC-0007-032"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Once a probe carries a packet's frames, the system MUST remove that packet's bytes from the outstanding bytes."
rationale = "A probe's packet and the original carry the same frames, and counting both would shrink the window that new data can use."
