[section]
anchor = "credentials"
title = "Credentials"
problem = "A receiver has to find the path secret and the key that protected each packet, and a packet that names neither would need a search or a second round trip before it could be opened."
motivation = "A credential in each packet names the path secret and the key derived from it, so the receiver finds the keys of a packet in one step and each key serves one purpose."
prose = "A credential identifies the keys that protected a packet. It holds a path secret identifier of 16 bytes and a key identifier, a variable-length integer that selects one set of keys derived from that path secret. Both endpoints of a path hold the same path secret, and the first bit of the identifier says which endpoint's copy it names."

[[requirement]]
id = "DC-0003-001"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A credential MUST consist of a 16-byte path secret identifier followed by a key identifier."
rationale = "The receiver reads the path secret from the first field and the key derived from it from the second, so one lookup finds the keys of a packet."

[[requirement]]
id = "DC-0003-002"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A credential MUST encode its key identifier as a QUIC variable-length integer, whose value is at most 2^62-1."
rationale = "The variable-length encoding keeps small key identifiers short while leaving room for a long-lived path to use many keys."

[[requirement]]
id = "DC-0003-003"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Decoding an encoded credential MUST yield the path secret identifier and the key identifier that were encoded."
rationale = "The two endpoints name the same keys only where the encoding loses nothing."

[[requirement]]
id = "DC-0003-004"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The most significant bit of the first byte of a path secret identifier MUST be set where the server holds the secret and clear where the client holds it."
rationale = "The two endpoints of a path hold the same secret, and the bit keeps their identifiers apart, so a packet reflected back to its sender doesn't match the sender's own keys."

[[requirement]]
id = "DC-0003-005"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST compute its peer's identifier of a shared path secret by inverting the most significant bit of the first byte of its own identifier."
rationale = "Each endpoint finds its peer's identifier without another message or lookup."

[[requirement]]
id = "DC-0003-006"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST derive each path secret identifier from its path secret, as the key derivation section states."
rationale = "An identifier derived from the secret is unpredictable to anyone without the secret, carries enough entropy to index a table of secrets without further hashing, and both endpoints derive it without exchanging it."
