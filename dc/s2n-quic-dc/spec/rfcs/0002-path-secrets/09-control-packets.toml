[section]
anchor = "control-packets"
title = "Secret control packets"
problem = "Two endpoints whose path secret states diverge, by a restart, an eviction or a gap in key identifiers, can't open each other's packets until one tells the other."
motivation = "Small authenticated control packets let a receiver tell a sender what went wrong, so the sender fixes its key identifiers or handshakes again, without letting a third party forge that report."
prose = "There are three secret control packets. A stale key packet carries one more than the highest key identifier its sender has seen, or 0 where it has seen none; a replay detected packet carries a key identifier its sender rejected; both are authenticated with the control key of the path secret they name, which RFC 0003 derives. An unknown path secret packet tells a peer that its sender doesn't hold the path secret a packet named, and is authenticated with the stateless reset token its sender gave for that path secret. RFC 0004 specifies their wire format."

[[requirement]]
id = "DC-0002-065"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST answer packets that name a path secret it doesn't hold with unknown path secret packets authenticated with the stateless reset token the endpoint computes for that path secret's identifier."
rationale = "The peer accepts the report only where it carries the token the peer stored for that path secret, and the endpoint can compute that token without the path secret."

[[requirement]]
id = "DC-0002-075"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST send its unknown path secret packets at a rate that stays within a limit the endpoint configures."
rationale = "The packets those answers reply to aren't authenticated, so without a bound a sender that forges its source address could make the endpoint send one answer for each packet it sends; the configured limit bounds what the endpoint sends, and a peer that keeps sending still receives an answer once the limit allows one. The rate limit doesn't bound the answers the endpoint holds while they wait to be sent: DC-0002-076 does."

[[requirement]]
id = "DC-0002-076"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST keep the unknown path secret packets waiting to be sent within a limit the endpoint configures for all path secrets and senders together, and drop each answer past that limit."
rationale = "Both the path secret's identifier and the sender of the packet an answer replies to come from a packet the endpoint can't authenticate, so a sender that forges its source address and the identifiers it names makes a new pair for each packet, and DC-0002-072's limit for each pair doesn't bound the total; without this limit, packets that arrive faster than DC-0002-075's rate sends answers would grow the endpoint's memory without a bound. A limit near what that rate sends in a short time keeps the waiting answers fresh, and a peer that keeps sending still receives an answer once one fits."

[[requirement]]
id = "DC-0002-066"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST authenticate each stale key and replay detected packet it sends with the control key of the path secret the packet names."
rationale = "Only an endpoint that holds the path secret can then send one, so a third party can't move the sender's key identifiers."

[[requirement]]
id = "DC-0002-067"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "An endpoint MUST NOT act on a secret control packet that fails authentication."
rationale = "An unauthenticated control packet could come from anyone on the path."

[[requirement]]
id = "DC-0002-068"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST find the path secret a received control packet names by the identifier of its own side of that path secret, derived from the identifier the packet carries."
rationale = "The packet's sender writes the identifier from its own side, and each side's identifier differs in the role it carries."

[[requirement]]
id = "DC-0002-069"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST request a handshake with the peer when it accepts an unknown path secret packet."
rationale = "The peer no longer holds the path secret, so only a new handshake restores the path."

[[requirement]]
id = "DC-0002-070"
level = "MAY"
polarity = "required"
binds_to = "system"
statement = "An endpoint MAY evict the path secret an accepted unknown path secret packet names, where its configuration asks for it."
rationale = "Evicting at once stops new flows under a path secret the peer can't open, at the cost of the flows still in progress."

[[requirement]]
id = "DC-0002-071"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "An endpoint MUST NOT treat an unknown path secret packet as proof that its peer holds the path secret."
rationale = "The stateless reset token authenticates the packet's origin weakly and says nothing of the path secret, so the packet can't clear a dead mark."

[[requirement]]
id = "DC-0002-072"
level = "SHOULD"
polarity = "required"
binds_to = "system"
statement = "An endpoint SHOULD keep at most one secret control packet waiting to be sent for each path secret and sender it answers, and drop the others."
rationale = "Control packets answer packets that keep arriving, so a later packet brings a fresh answer, and more than one waiting answer for the same path secret and sender would only add delay. For unknown path secret packets both identifiers come from packets the endpoint can't authenticate, so this limit doesn't bound the endpoint's memory; DC-0002-076 does."
