[section]
anchor = "secret-map"
title = "The secret map"
problem = "An endpoint that keeps path secrets for many peers has to find the right secret for each packet it receives and each flow it opens, and its memory for them is finite."
motivation = "A map indexed both by peer address and by path secret identifier answers both lookups, and a fixed capacity with a clear eviction order bounds its memory."
prose = "An endpoint keeps each path secret it holds in its secret map, which a packet's path secret identifier and a peer's address both index. A path secret enters the map when its handshake exchanges stateless reset tokens, and becomes the one chosen for the peer's address when the handshake completes."

[[requirement]]
id = "DC-0002-024"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST keep the path secrets for which it was the client apart from those for which it was the server, so that one peer address can hold a path secret in each role."
rationale = "Two endpoints can each handshake with the other, and a path secret of one role would otherwise replace the other's while flows still use it."

[[requirement]]
id = "DC-0002-025"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST find the path secret for a received packet by the path secret identifier the packet carries."
rationale = "A packet can arrive from an address other than the one its handshake used, and the identifier names its path secret exactly."

[[requirement]]
id = "DC-0002-026"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST choose the path secret for a new flow to a peer by the peer's address, among the path secrets for which it was the client."
rationale = "The endpoint that opens a flow is the one that handshook as the client, so it seals the flow with that path secret."

[[requirement]]
id = "DC-0002-027"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "When a handshake completes for a peer address and role for which the endpoint already holds a path secret, the endpoint MUST choose the new path secret for the new flows of that address and role."
rationale = "The newer handshake is the one both endpoints most recently agreed on."

[[requirement]]
id = "DC-0002-028"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST retire the earlier path secret that a newer one replaces for a peer address and role, keeping it for the packets that still use it until it is evicted."
rationale = "Flows opened under the earlier path secret go on until they end, so dropping it at once would fail them."

[[requirement]]
id = "DC-0002-029"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "An endpoint MUST hold at most a configured number of path secrets."
rationale = "A bound on the count bounds the memory the secret map takes."

[[requirement]]
id = "DC-0002-030"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "When a new path secret takes the count past the configured capacity, the endpoint MUST evict the path secret it recorded earliest."
rationale = "Evicting in the order of recording is simple to predict, and the earliest path secret is the likeliest to have been replaced."

[[requirement]]
id = "DC-0002-031"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "An endpoint MUST NOT remove a newer path secret from the address index when it evicts an earlier path secret for the same peer address."
rationale = "Eviction of a replaced path secret would otherwise leave the peer's address without the path secret that replaced it."

[[requirement]]
id = "DC-0002-032"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "An endpoint MUST NOT hold two path secrets with the same identifier."
rationale = "A packet names its path secret by the identifier, so two path secrets with one identifier would make the lookup ambiguous."
