[section]
anchor = "accepting"
title = "Accepting streams"
problem = "A server needs to hand each incoming stream to the part of the application that serves it, and to keep a slow consumer from holding an unbounded number of streams."
motivation = "Routing by acceptor identifier lets one endpoint serve several services, bounded queues with a chosen eviction policy keep memory bounded under load, and spreading streams over receivers lets the application scale out."
prose = "A server registers acceptors on its endpoint, each under an identifier. Each incoming stream goes to the acceptor its identifier names, and waits in a receiver's queue until the application takes it. A stream that arrives before any receiver has asked for one is turned away as busy. The application clones a receiver to add workers, and drops every receiver to retire the acceptor."

[[requirement]]
id = "DC-0006-037"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST refuse to start where its endpoint and its handshake provider don't share one map of path secrets."
rationale = "Streams would arrive under path secrets the endpoint can't find, so every stream would fail."

[[requirement]]
id = "DC-0006-038"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST deliver each incoming stream to the acceptor registered under the stream's acceptor identifier."
rationale = "The identifier is how a client picks the service it talks to."

[[requirement]]
id = "DC-0006-039"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST refuse to register an acceptor under an identifier that is still registered, and report that the identifier is in use."
rationale = "Two acceptors under one identifier would split one service's streams unpredictably, and an identifier stays registered until the server has removed its acceptor."

[[requirement]]
id = "DC-0006-040"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST let acceptors registered under different identifiers receive streams at the same time."
rationale = "One endpoint can then serve several services."

[[requirement]]
id = "DC-0006-041"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A server MUST reject a stream whose acceptor identifier doesn't name a registered acceptor."
rationale = "The client then learns of its mistake instead of waiting on a stream that nobody reads."

[[requirement]]
id = "DC-0006-042"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Each receiver of an acceptor MUST hold its waiting streams in a queue whose capacity the application configures."
rationale = "A bounded queue keeps a slow consumer from holding unbounded memory."

[[requirement]]
id = "DC-0006-043"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "When a receiver's queue is full, the server MUST evict either the oldest or the newest waiting stream, as the application configures."
rationale = "Some services favor the newest requests under overload and others the oldest, and the choice is the application's."

[[requirement]]
id = "DC-0006-044"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "The server MUST reset each stream it evicts from a receiver's queue."
rationale = "The client of an evicted stream then learns that it won't be served, instead of waiting on it."

[[requirement]]
id = "DC-0006-045"
level = "SHOULD"
polarity = "required"
binds_to = "system"
statement = "Where an acceptor has several receivers, the server SHOULD give each stream to the less loaded of two receivers it picks at random."
rationale = "Picking the less loaded of two spreads streams evenly across workers at a low cost for each stream."

[[requirement]]
id = "DC-0006-046"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "The server MUST NOT give streams to a receiver that hasn't yet asked for one."
rationale = "Streams sent to a receiver that nobody polls would wait in its queue and be evicted while other receivers are idle."

[[requirement]]
id = "DC-0006-054"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Where an acceptor has receivers and none of them has asked for a stream yet, the server MUST reset an incoming stream to that acceptor as busy."
rationale = "The client learns at once that the service isn't ready, instead of waiting on a stream that nobody takes."

[[requirement]]
id = "DC-0006-047"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "Once every receiver of an acceptor is dropped, the server MUST reject streams to the acceptor's identifier, and remove its registration once a stream to it finds every receiver gone."
rationale = "A retired acceptor then stops taking streams at once, and frees its identifier for a new registration once the server has seen that it is gone."
