[section]
anchor = "sending"
title = "Sending"
problem = "A key stays secret, and a receiver can tell a new datagram from a repeated one, only where no two datagrams a sender seals under one key share a packet number."
motivation = "Numbering each datagram from one counter that never goes back lets the cipher's nonce and the receiver's replay check rely on the number alone, and failing a send that can't be framed keeps a malformed packet off the wire."
prose = "A sender holds one key and the credentials of the path secret the key was derived from, and numbers the datagrams it seals from zero, one number for each send, a send that fails among them. A send that can't be framed, because the packet numbers are spent, the payload is too long for its length field or the caller's buffer can't hold the packet, fails without writing a packet. A caller can ask, before it sends, the most bytes the packet of a payload can take."

[[requirement]]
id = "DC-0009-001"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST give each datagram it seals under a key a packet number that no earlier datagram under that key had, whichever of its callers sends it, and whether or not callers send at the same time."
rationale = "The packet number is the cipher's nonce, and a nonce used twice under one key breaks the confidentiality and the integrity of both datagrams."

[[requirement]]
id = "DC-0009-002"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST take zero as the packet number of its first send, and one more than the number of the send before it as the number of each later send, whether or not the send before it failed."
rationale = "Rising numbers suit the receiver's replay window, and a counter from zero needs no state beyond the counter; a failed send leaves a gap in the numbers a receiver sees, which the window accepts."

[[requirement]]
id = "DC-0009-003"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "A sender MUST NOT seal a datagram whose packet number is larger than a 62-bit variable-length integer holds, and fails that send instead."
rationale = "A counter that wrapped around would use a nonce a second time under the same key."

[[requirement]]
id = "DC-0009-004"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST fail a send whose payload is longer than the packet's payload length field can state."
rationale = "A length that doesn't fit its field would make the receiver read the packet's bytes at the wrong places."

[[requirement]]
id = "DC-0009-005"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST fail a send, without writing to the caller's buffer, where that buffer is shorter than the packet the send would write."
rationale = "A packet cut short at the end of a buffer can't be authenticated, and a write past the buffer's end would damage the caller's memory."

[[requirement]]
id = "DC-0009-006"
level = "MUST"
polarity = "required"
binds_to = "system"
statement = "A sender MUST answer a caller, before any send, the most bytes the packet of a payload of a given length can take, or that a payload of that length is too long to send."
rationale = "A caller sizes its buffers and splits its data to fit the path before it sends, and needs the packet's length to do so. The answer is an upper bound, since the packet's variable-length fields can be shorter than their longest form."
