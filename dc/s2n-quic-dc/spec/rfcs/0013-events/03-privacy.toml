[section]
anchor = "privacy"
title = "Credentials and secrets in diagnostics"
problem = "A credential identifier or key material copied into a log or a stored snapshot reaches readers who were never meant to hold it."
motivation = "Keeping secrets out of every stored snapshot lets developers share them freely, and saying which forms carry the credential identifier tells an operator which logs to protect."
prose = "An event delivered to the subscriber may carry the identifier of the credential a connection uses, so that the application can group the events of one peer. The snapshot form of an event, taken for a test, hides that identifier, while the ordinary debug form of an event and the integration that writes events as log lines both write it, so a debug-level log of events holds it. No event, metric or log line carries key material."

[[requirement]]
id = "DC-0013-018"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "The snapshot form of an event MUST NOT show the value of a credential identifier."
rationale = "Snapshots are stored beside the code and read by everyone who reads it, and a credential identifier names the peer's secret."

[[requirement]]
id = "DC-0013-019"
level = "MUST"
polarity = "forbidden"
binds_to = "system"
statement = "An event, a metric or a log line MUST NOT carry the bytes of a key or of a path secret."
rationale = "Anyone who reads key material can read or forge the traffic it protects."

[[requirement]]
id = "DC-0013-020"
level = "MAY"
polarity = "required"
binds_to = "system"
statement = "An event delivered to the subscriber MAY carry the identifier of the credential a connection uses."
rationale = "The application can join the events of one peer by it, and the application already holds that identifier."
