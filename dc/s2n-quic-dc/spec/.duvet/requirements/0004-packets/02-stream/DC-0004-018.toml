target = "rendered/0004-packets/02-stream.md#DC-0004-018"

[[spec]]
level = "MUST"
quote = "A stream packet's fields MUST appear in this order: the tag, the credentials, the wire version, two reserved bytes, the stream identifier, the source queue identifier, the packet number, the retransmission offset, the next expected control packet number, the stream offset, the final offset, the control data length, the payload length, the application header length, the application header, the control data, the payload and the authentication tag, each optional field only where its condition holds."
