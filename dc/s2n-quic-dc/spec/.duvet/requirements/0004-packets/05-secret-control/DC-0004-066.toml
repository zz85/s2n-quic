target = "rendered/0004-packets/05-secret-control.md#DC-0004-066"

[[spec]]
level = "MUST"
quote = "A replay detected packet MUST hold, in this order, its tag, the credential identifier, the wire version, the sender's queue identifier where the tag's bit 0x04 is set, the key identifier its sender rejected as a replay, and a 16-byte authentication tag."
