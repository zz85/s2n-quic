target = "rendered/0007-recovery/04-congestion-control.md#DC-0007-027"

[[spec]]
level = "MUST"
quote = "A sender MUST lower a limit that caps its window, and that never caps it below the sender's minimum window, within the round trip after one in which the peer's count of packets marked congestion experienced increased after both that round trip's start and the sender's last start of a cycle of bandwidth probing, unless the sender was starting up or probing for more bandwidth when that round trip ended."
