target = "rendered/0007-recovery/04-congestion-control.md#DC-0007-027"

[[spec]]
level = "MUST"
quote = "A sender MUST lower a limit that caps its window, and that never caps it below the sender's minimum window, within the round trip after one in which the peer's count of packets marked congestion experienced increased, unless at some point in that round trip the sender was starting up, draining the queue its start-up built, probing for more bandwidth, or probing its round-trip time."
