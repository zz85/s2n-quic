target = "rendered/0007-recovery/04-congestion-control.md#DC-0007-024"

[[spec]]
level = "MUST"
quote = "Except for data it sends as a fast retransmission or as a probe, the data a sender has sent and not yet seen acknowledged MUST stay within a window that the sender sets from the path's bottleneck bandwidth and minimum round-trip time, as it measures them from the acknowledgements it receives."
