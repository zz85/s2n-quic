target = "rendered/0007-recovery/04-congestion-control.md#DC-0007-024"

[[spec]]
level = "MUST"
quote = "Except when it sends a fast retransmission or a probe, a sender MUST send a packet that becomes outstanding only where the total size of its outstanding packets whose frames no probe has carried again, that packet included, stays within a window that it sets from the path's bottleneck bandwidth and minimum round-trip time, as it measures them from the acknowledgements it receives."
